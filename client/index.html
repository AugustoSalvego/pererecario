<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4cb944">
  <meta name="description" content="Pererecário: ande por aí e capture as pererecas das lagoinhas. Funciona online e offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pererecário">
  <title>Pererecário</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <div class="splash-screen" id="splash">
      <div style="text-align:center">
        <h1 class="logo">Pererecário</h1>
        <img class="loader-frog" src="assets/icons/icon-192.png" alt="">
      </div>
    </div>
    <section id="login" class="hidden"></section>
    <section id="game" class="hidden"></section>
    <div class="sheet-root" id="sheet-root"></div>
    <div class="toasts" id="toasts"></div>
  </div>
  <noscript>O Pererecário precisa de JavaScript para funcionar.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
