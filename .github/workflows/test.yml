name: testes
on: [push, pull_request]
jobs:
  # testes com SQLite em memória (rápido, sem dependências)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verificar sintaxe do cliente
        run: for f in $(find client/js -name '*.js'); do node --check "$f"; done

  # os mesmos testes contra um PostgreSQL de verdade (o banco de produção), incluindo
  # o teste de conexões caindo quando o banco reinicia
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pererecario
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pererecario
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # um arquivo de teste por vez: os dois usam o mesmo banco
      - run: node --disable-warning=ExperimentalWarning --test --test-concurrency=1 test/*.test.js
