name: Validate Pererecario
on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate species and atlas
        run: python scripts/validate_catalog.py && python scripts/validate_preview.py

