# Deploy no Render (Blueprint): https://render.com/docs/blueprint-spec
# Cria o servidor web (Node). O banco é um PostgreSQL permanente fora do Render (Neon, grátis e
# sem prazo de validade): o Postgres gratuito do próprio Render expira em 30 dias e não tem backup.
# Passo a passo completo: docs/HOSPEDAGEM.md
services:
  - type: web
    name: pererecario
    runtime: node
    plan: free
    region: virginia            # mesma região do banco no Neon (AWS US East, N. Virginia)
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # o Render pede o valor na criação: a "connection string" do Neon (postgresql://...)
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false # o Render pede o valor na criação: é a senha do painel /admin e do backup
      - key: GOOGLE_CLIENT_ID
        sync: false # opcional: o "Client ID" do Google para o botão "Continuar com Google" (docs/HOSPEDAGEM.md, passo 4); vazio = só e-mail e senha
      - key: CARTO_KEY
        sync: false # opcional: chave gratuita do mapa CARTO (carto.com/basemaps/apikey); vazio = OpenStreetMap
