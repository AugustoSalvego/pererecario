# Deploy no Render (Blueprint): https://render.com/docs/blueprint-spec
# Cria o servidor web (Node) + um banco PostgreSQL gratuito e liga os dois.
services:
  - type: web
    name: pererecario
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: pererecario-db
          property: connectionString
      - key: TOKEN_SECRET
        generateValue: true
      - key: ADMIN_KEY
        sync: false # o Render pede o valor na criação: é a senha do painel /admin
      - key: CARTO_KEY
        sync: false # opcional: chave gratuita do mapa CARTO (carto.com/basemaps/apikey); vazio = OpenStreetMap

databases:
  - name: pererecario-db
    plan: free
