 if (state.owned.length===0) return speciesById.frog_leaf;

 if (state.sinceSpecial>=19) return speciesById.frog_star;

  cumulative+=DATA.tiers[tier].weight;

  $('camera-status').className='camera-status warn';$('camera-status').textContent=state.cameraMessage;
  return;
 }
 const completed=registerCapture();
 if(!completed)return;
 state.cameraMood='win';state.cameraMessage='Fotografia salva neste navegador!';
 $('camera-status').className='camera-status win';$('camera-status').textContent=state.cameraMessage;
 success(completed.s,completed.duplicate);
}
function renderInventory(){const groups=state.owned.reduce((out,f)=>{(out[f.id]??=[]).push(f);return out},{})||{};const duplicates=state.owned.length-state.found.size;$('inventory').innerHTML=`<div class="section-title" style="margin-top:0"><div><span class="eyebrow muted">SEU CANTINHO NO BREJO</span><h2>Meu Brejo</h2><p>Seus exemplares, inclusive aqueles de espécies já descobertas.</p></div><span class="pill">🌿 ${state.owned.length} exemplares</span></div><div class="feature-box" style="margin-bottom:22px"><div class="section-head"><div><h3 style="margin-bottom:8px">Cada um tem seu lugar</h3><p style="margin-bottom:0">Aqui os exemplares ficam parados, sem as animações especiais da ficha principal. Uma mesma espécie pode ter vários exemplares de tamanhos diferentes.</p></div><span class="pill">${Math.max(0,duplicates)} repetidos</span></div></div><div class="inventory-grid">${Object.entries(groups).flatMap(([id,items])=>items.map((item,n)=>{const s=speciesById[id];return `<div class="inventory-card"><div class="inventory-art"><canvas width="95" height="100" data-frog="${id}" data-inventory="1"></canvas></div><div><b>${s.name}</b><small>Exemplar #${item.code}<br>≈ ${item.cm.toFixed(1)} cm · ${n?'Repetido':'Colecionado'}</small><br>${rarity(s)}</div></div>`})).join('')||'<div class="empty"><b>Seu Brejo está vazio</b>Explore para encontrar seu primeiro exemplar.</div>'}</div><p class="subtle-note">♻️ Repetidos não aumentam o número de espécies descobertas. Futuramente eles poderão ser usados em trocas online.</p>`;drawStatic();}
function renderGuide(){
 $('guide').innerHTML=`<div class="section-title" style="margin-top:0"><div><span class="eyebrow muted">COMO JOGAR</span><h2>Guia do explorador</h2><p>Descubra criaturas, complete seu álbum e encontre a Estrelinha!</p></div></div>
 <div class="feature-pair"><div class="feature-box"><h3>🍃 Raridades de verdade</h3><p>As probabilidades são calculadas por categoria a cada novo encontro: 60% comuns, 28% incomuns, 10% raras e 2% especiais.</p><div class="rarity-row">${['common','uncommon','rare','special'].map(t=>rarity({tier:t})).join('')}</div><p style="margin-top:15px">Há proteções contra azar: após 4 repetidas seguidas, a próxima é inédita (se restarem espécies); após 9 encontros sem rara/especial, vem uma rara ou especial; após 19 sem especial, vem a Estrelinha.</p></div><div class="feature-box"><h3>📸 Uma fotografia por encontro</h3><p>Toque em Explorar, procure uma perereca e fotografe quando ela estiver no centro da moldura.</p><p>Errou? Pode tentar novamente. Depois de dois erros, a ajuda mantém a perereca centralizada. Nenhuma escapa.</p><p>Se você sair e voltar, o encontro continua sem trocar de espécie.</p></div></div>
 <div class="section-title"><div><span class="eyebrow muted">SEU JOGO</span><h2>Opções e progresso</h2></div></div>
 <div class="feature-box"><label class="preference"><span><b>Reduzir animações</b><p>Reduz saltos e efeitos de movimento. A captura continua possível.</p></span><input class="toggle" id="reduce-motion" type="checkbox" ${state.reduced?'checked':''}></label>
 <div class="preference"><span><b>Progresso da coleção</b><p>${state.found.size} de 15 espécies e ${state.owned.length} exemplares. ${storageAvailable?'Salvo neste navegador.':'Armazenamento indisponível: o progresso pode ser perdido ao fechar.'}</p></span><span class="pill">${Math.round(state.found.size/15*100)}%</span></div>
 <div class="preference"><span><b>Reiniciar simulação</b><p>Apaga as capturas e começa de novo com a Folhinha.</p></span><button class="btn outline small" id="reset-demo">Reiniciar</button></div></div>
 <div class="section-title"><div><span class="eyebrow muted">ANTES DO APK</span><h2>O que ainda falta</h2></div></div>
 <div class="feature-box"><p style="margin:0">Este jogo funciona no navegador, com um cenário ilustrado em vez de usar câmera e GPS reais. O progresso fica apenas no armazenamento deste navegador e não é sincronizado entre dispositivos. O APK Flutter virá depois desta validação.</p></div>`;
 $('reduce-motion').onchange=e=>{state.reduced=e.target.checked};
 $('reset-demo').onclick=()=>{
  if(!confirm('Quer apagar o progresso local do simulador e voltar à primeira descoberta?'))return;
  try{localStorage.removeItem(GAME_KEY)}catch{storageAvailable=false}
  state.found=new Set();state.owned=[];state.encounter=null;state.encounterNumber=1;
  state.duplicatesStreak=0;state.sinceRare=0;state.sinceSpecial=0;
  state.captureId='frog_leaf';state.assist=false;state.misses=0;state.captured=false;
  state.modal=null;closeModal();renderAll();go('home');
 };
}
function openDetail(id){const s=speciesById[id];const locked=!found(s);state.selected=id;state.openAt=performance.now();state.hopAt=-10000;state.modal='detail';const el=$('modal');el.className='modal-backdrop';el.hidden=false;el.innerHTML=`<div class="detail" role="dialog" aria-modal="true" aria-label="Ficha da espécie"><button class="modal-close" id="close-modal" aria-label="Fechar">×</button><div class="detail-wrap"><div class="detail-art ${s.tier==='special'&&!locked?'special-art':''}"><canvas width="420" height="430" id="detail-canvas" aria-label="${locked?'Silhueta':s.name}"></canvas><span class="detail-art-label">${locked?'Mistério do brejo':s.tier==='special'?'✧ Espécie especial':'Caderno de campo'}</span></div><div class="detail-copy"><span class="eyebrow muted">ESPÉCIE ${num(s.index)} / 15</span><h2>${locked?'???':s.name}</h2>${locked?'<span class="rarity common">Ainda não descoberta</span>':rarity(s)}<p style="margin-top:15px">${locked?'Esta pequena habitante ainda não foi encontrada. Continue explorando para revelar seu jeitinho.':s.description}</p>${locked?'<div class="trait-chip"><b>🔒 Uma surpresa por descobrir</b><p>A peculiaridade será revelada após a captura.</p></div>':`<div class="trait-chip"><b>✧ ${s.albumInteraction.name}</b><p>${s.albumInteraction.description}</p></div><p style="font-size:12px;margin:12px 0">${count(s.id)} exemplar(es) no Meu Brejo · Aproximadamente ${s.sizeCm.join('–')} cm</p>`}<div class="detail-actions">${locked?'<button class="btn primary" id="find-this">Ir explorar ›</button>':'<button class="btn primary" id="hop">🐸 Dar um pulinho</button><button class="btn outline" id="find-this">Ir explorar ›</button>'}</div></div></div></div>`;
 $('close-modal').onclick=closeModal;$('find-this').onclick=()=>{closeModal();go('camera')};if($('hop'))$('hop').onclick=()=>{state.hopAt=performance.now()};}
function success(s,duplicate){state.modal='success';const el=$('modal');el.hidden=false;el.className='modal-backdrop success';el.innerHTML=`<div class="detail confetti" role="dialog" aria-modal="true" aria-label="Captura realizada"><button class="modal-close" id="close-modal" aria-label="Fechar">×</button><span class="eyebrow muted">✧ ${duplicate?'MAIS UM NOVO AMIGO':'NOVA DESCOBERTA'} ✧</span><div class="success-stage"><canvas id="success-canvas" width="240" height="190"></canvas></div><h2 class="success-title">${duplicate?'Mais um '+s.name+'!':'Você encontrou '+s.name+'!'}</h2><p class="success-caption">${duplicate?'Um novo exemplar entrou no seu Brejo.':'Uma nova espécie foi revelada no seu Pererecário.'} O exemplar está no seu Brejo!</p>${rarity(s)}<div style="display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:20px"><button class="btn primary" id="success-album">Ver álbum ›</button><button class="btn outline" id="success-again">Explorar mais</button></div></div>`;
 $('close-modal').onclick=closeModal;$('success-album').onclick=()=>{closeModal();go('home');openDetail(s.id)};$('success-again').onclick=()=>{closeModal();startEncounter()};drawStatic();}
function closeModal(){state.modal=null;$('modal').hidden=true;$('modal').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
$('app').addEventListener('click',()=>{});
function pose(s,now,hero){const cfg=s.albumInteraction,t=(((now-(hero?state.openAt:0))/cfg.periodMs)+(hero?0:cfg.phaseOffset))%1;const u=(t-.025)/.47;const active=u>0&&u<1;const p=active?Math.sin(u*Math.PI)**2:0;const twice=active?Math.sin(u*Math.PI*2)**2:0;const a={sx:1,sy:1,dy:0,angle:0,hue:0,light:1,pulse:p};switch(cfg.type){case 'color_shift':a.hue=p*38;break;case 'jade_shift':a.hue=p*32;break;case 'cheeks':a.sx+=p*.045;a.sy+=p*.015;break;case 'throat':a.sx+=p*.02;a.sy+=p*.03;break;case 'double_croak':a.sx+=twice*.035;a.sy+=twice*.02;break;case 'puff':a.sx+=p*.10;a.sy+=p*.045;break;case 'double_hop':a.dy-=twice*.09;break;case 'crouch_hop':a.dy-=p*.10;break;case 'breath':a.sx+=p*.035;a.sy+=p*.05;break;case 'warm_glow':a.hue=-p*9;a.light+=p*.08;break;case 'starlight':a.light+=p*.42;a.dy-=p*.035;break;case 'look_around':a.angle=active?Math.sin(u*Math.PI*2)*.075*p:0;break;case 'shy':a.sy-=p*.09;break;case 'stretch':a.sy+=p*.10;break;case 'sway':a.angle=active?Math.sin(u*Math.PI*2)*.055*p:0;break;}return a;}
function sparkle(ctx,x,y,r,alpha,i){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=i%2?'#d7edff':'#fff2aa';ctx.beginPath();ctx.moveTo(x,y-r*1.7);ctx.lineTo(x+r*.22,y-r*.22);ctx.lineTo(x+r*1.45,y);ctx.lineTo(x+r*.22,y+r*.22);ctx.lineTo(x,y+r*1.7);ctx.lineTo(x-r*.22,y+r*.22);ctx.lineTo(x-r*1.45,y);ctx.lineTo(x-r*.22,y-r*.22);ctx.fill();ctx.restore();}
function frogCanvas(canvas,s,opts={}){if(!art.complete||!art.naturalWidth)return;const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;ctx.clearRect(0,0,W,H);ctx.imageSmoothingEnabled=false;const hero=!!opts.hero,moving=hero&&!state.reduced&&!opts.locked,now=opts.now??performance.now();const a=moving?pose(s,now,true):{sx:1,sy:1,dy:0,angle:0,hue:0,light:1,pulse:0};const [sx,sy,sw,sh]=s.rect;const scale=Math.min(W*(hero?.73:.77)/sw,H*(hero?.66:.76)/sh);const dw=sw*scale,dh=sh*scale;const x=W*.5+(opts.dx||0)*W,baseline=H*(opts.camera?.79:.84)+(opts.dy||0)*H;ctx.save();ctx.translate(x,baseline+a.dy*dh);const hop=(now-state.hopAt)/630;if(moving&&hop>=0&&hop<=1)ctx.translate(0,-Math.sin(hop*Math.PI)*H*.12);ctx.rotate(a.angle);ctx.scale(a.sx,a.sy);
 if(moving&&s.id==='frog_star'){const glow=.52+a.pulse*.48;const radius=Math.max(dw,dh)*.86;const gradient=ctx.createRadialGradient(0,-dh*.53,2,0,-dh*.53,radius);gradient.addColorStop(0,`rgba(255,246,174,${.35+.34*glow})`);gradient.addColorStop(.48,`rgba(164,212,255,${.13+.18*glow})`);gradient.addColorStop(1,'rgba(164,212,255,0)');ctx.fillStyle=gradient;ctx.beginPath();ctx.arc(0,-dh*.53,radius,0,Math.PI*2);ctx.fill();}
 ctx.filter=`hue-rotate(${a.hue}deg) brightness(${a.light})`;
 ctx.drawImage(art,sx,sy,sw,sh,-dw*.5,-dh,dw,dh);ctx.filter='none';
 if(opts.locked){ctx.globalCompositeOperation='source-in';ctx.fillStyle='#71847c';ctx.fillRect(-dw*.5-5,-dh-5,dw+10,dh+10);ctx.globalCompositeOperation='source-over';}
 if(moving&&s.id==='frog_star'){const spots=[[-.58,-.76],[-.21,-1.16],[.51,-.85],[.6,-.4],[-.62,-.35],[.19,-1.08]];spots.forEach(([xx,yy],i)=>{const shimmer=.62+.38*Math.sin(now/400+i*1.9);sparkle(ctx,xx*dw,yy*dh,Math.max(2.7,dw*.024)*(i%3?1:1.3),shimmer,i)})}
 ctx.restore();}
function drawStatic(){document.querySelectorAll('canvas[data-frog]').forEach(c=>frogCanvas(c,speciesById[c.dataset.frog],{locked:c.dataset.locked==='1'}));document.querySelectorAll('canvas[data-banner]').forEach(c=>frogCanvas(c,speciesById[c.dataset.banner]));if($('success-canvas')&&state.modal==='success'&&state.encounter)frogCanvas($('success-canvas'),speciesById[state.captureId]);}
let previousFrame=0;
function animate(now){
 if(!document.hidden&&art.complete&&art.naturalWidth){
  if(state.modal==='detail'&&$('detail-canvas')){
   const s=speciesById[state.selected];frogCanvas($('detail-canvas'),s,{locked:!found(s),hero:true,now});
  }
  if(state.page==='camera'&&state.encounter&&!state.encounter.captured&&$('camera-canvas')){
   const s=speciesById[state.encounter.id];
   const t=(now-state.cameraStart)/DATA.tiers[s.tier].periodMs;
   const spread=.18+DATA.tiers[s.tier].amplitude*.65;
   const move=state.reduced||state.assist?0:Math.sin(t*2*Math.PI)*spread;
   state.cameraPose=move;
   const dy=state.reduced?0:-Math.max(0,Math.sin(t*Math.PI*4))*.028;
   frogCanvas($('camera-canvas'),s,{dx:move,dy,camera:true});
   const f=$('focus');if(f)f.classList.toggle('ready',Math.abs(move)<=.17);
  }
  if(now-previousFrame>150){previousFrame=now;
   if($('success-canvas')&&state.modal==='success'&&state.encounter)frogCanvas($('success-canvas'),speciesById[state.captureId]);
  }
 }
 requestAnimationFrame(animate);
}
art.onload=()=>{shell();requestAnimationFrame(animate)};
art.onerror=()=>{$('app').innerHTML='<p style="padding:40px">Não foi possível carregar a arte das pererecas.</p>'};
art.src = ATLAS;

</script>
